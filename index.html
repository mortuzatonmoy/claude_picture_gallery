<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Picture Gallery — Nature in 4K</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f0e;color:#e8ece9;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
  header{text-align:center;padding:56px 16px 20px}
  h1{margin:0;font-weight:600;font-size:clamp(28px,4vw,44px)}
  header p{color:#9aa39d;margin:10px 0 0}
  main{display:grid;gap:22px;padding:24px;max-width:1500px;margin:auto;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
  .card{all:unset;display:block;background:#171a18;border-radius:14px;overflow:hidden;cursor:zoom-in;transition:transform .25s,box-shadow .25s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 40px #0009;outline:none}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .card .cap{padding:12px 16px 14px}
  .card b{display:block;font-size:17px}
  .card span{color:#8d968f;font-size:13px}

  /* Viewer */
  #viewer{position:fixed;inset:0;background:#000;display:none;z-index:10;touch-action:none;user-select:none}
  #viewer.open{display:block}
  #stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
  #stage.drag{cursor:grabbing}
  #big{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;max-width:none}
  .bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#000a;backdrop-filter:blur(8px);padding:6px;border-radius:999px}
  .bar button,.nav,.close{background:#ffffff1a;color:#fff;border:0;border-radius:999px;font-size:18px;min-width:42px;height:42px;cursor:pointer}
  .bar button:hover,.nav:hover,.close:hover{background:#ffffff33}
  #zl{color:#ddd;font-size:13px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:24px}
  #prev{left:16px}#next{right:16px}
  .close{position:absolute;top:16px;right:16px}
  #title{position:absolute;top:22px;left:20px;font-size:15px;color:#ddd;text-shadow:0 1px 4px #000}
  #hint{position:absolute;top:50px;left:20px;font-size:12px;color:#aaa}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;pointer-events:none}
  footer{text-align:center;color:#69716b;padding:36px;font-size:13px}
  footer a{color:#9fc7a8}
</style>
</head>
<body>
<header>
  <h1>Claude Picture Gallery</h1>
  <p>প্রকৃতির ৫টি 4K (3840×2160) ছবি — শুধু কোড আর গণিত দিয়ে আঁকা। ছবিতে ক্লিক করুন, তারপর জুম করুন।</p>
</header>
<main id="grid"></main>

<div id="viewer" aria-modal="true" role="dialog">
  <div id="stage"><img id="big" alt=""></div>
  <div id="loading">লোড হচ্ছে…</div>
  <div id="title"></div>
  <div id="hint">মাউস হুইল / পিঞ্চ = জুম · টেনে সরান · ডাবল-ক্লিক = জুম · ← → = পরের ছবি · Esc = বন্ধ</div>
  <button class="close" id="close" title="বন্ধ (Esc)">✕</button>
  <button class="nav" id="prev" title="আগের">‹</button>
  <button class="nav" id="next" title="পরের">›</button>
  <div class="bar">
    <button id="zout" title="Zoom out">−</button>
    <div id="zl">100%</div>
    <button id="zin" title="Zoom in">+</button>
    <button id="fit" title="Fit" style="font-size:14px;padding:0 14px">Fit</button>
    <button id="one" title="Actual pixels" style="font-size:14px;padding:0 14px">1:1</button>
    <a id="dl" download><button title="Download 4K" style="font-size:14px;padding:0 14px">⬇ 4K</button></a>
  </div>
</div>

<footer>Generated by Claude · সোর্স কোড: <a href="generate.py">generate.py</a></footer>

<script>
const photos = [
  ["01_mountain_lake_sunrise","Mountain Lake Sunrise","বরফে ঢাকা পাহাড়, পাইন বন আর লেকে প্রতিবিম্ব"],
  ["02_misty_pine_forest","Misty Pine Forest","কুয়াশাভেজা পাইন বনে সূর্যের আলোর রেখা"],
  ["03_ocean_sunset","Ocean Sunset","সমুদ্রে সূর্যাস্ত, ঢেউয়ে ঝিকিমিকি আলো আর সৈকত"],
  ["04_milky_way_night","Milky Way Night","পাহাড়ের ওপর তারাভরা আকাশ আর ছায়াপথ"],
  ["05_green_meadow","Green Meadow","সবুজ পাহাড়ি মাঠ, সাদা মেঘ আর বুনো ফুল"],
];
const grid = document.getElementById('grid');
photos.forEach(([f,t,d],i)=>{
  const b=document.createElement('button'); b.className='card';
  b.innerHTML=`<img src="images/thumbs/${f}.jpg" loading="lazy" alt="${t}"><div class="cap"><b>${t}</b><span>${d}</span></div>`;
  b.onclick=()=>openViewer(i); grid.appendChild(b);
});

const V=document.getElementById('viewer'), S=document.getElementById('stage'), I=document.getElementById('big');
const zl=document.getElementById('zl'), loading=document.getElementById('loading');
let idx=0, scale=1, tx=0, ty=0, fitScale=1;
const MAX=8;

function apply(){ I.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; zl.textContent=Math.round(scale*100)+'%'; }
function clamp(){
  const w=I.naturalWidth*scale, h=I.naturalHeight*scale, vw=S.clientWidth, vh=S.clientHeight;
  tx = w<=vw ? (vw-w)/2 : Math.min(0,Math.max(vw-w,tx));
  ty = h<=vh ? (vh-h)/2 : Math.min(0,Math.max(vh-h,ty));
}
function fit(){ fitScale=Math.min(S.clientWidth/I.naturalWidth, S.clientHeight/I.naturalHeight); scale=fitScale; clamp(); apply(); }
function zoomAt(newScale, cx, cy){
  newScale=Math.min(MAX, Math.max(fitScale, newScale));
  tx = cx - (cx-tx)*newScale/scale; ty = cy - (cy-ty)*newScale/scale;
  scale=newScale; clamp(); apply();
}
function show(i){
  idx=(i+photos.length)%photos.length; const [f,t]=photos[idx];
  document.getElementById('title').textContent=`${idx+1}/${photos.length} · ${t}`;
  document.getElementById('dl').href=`images/${f}.jpg`;
  loading.style.display='grid';
  I.src=`images/thumbs/${f}.jpg`;          // instant preview
  let thumbReady=false;
  I.onload=()=>{ thumbReady=true; fit(); };
  const full=new Image(); full.src=`images/${f}.jpg`;
  full.onload=()=>{ if(photos[idx][0]!==f) return;
    I.onload=()=>{ loading.style.display='none';
      if(!thumbReady || Math.abs(scale/fitScale-1)<0.01){ fit(); return; }
      const k=I.naturalWidth/1280;   // keep the same view, now in full resolution
      fitScale=Math.min(S.clientWidth/I.naturalWidth,S.clientHeight/I.naturalHeight);
      scale=scale/k; clamp(); apply(); };
    I.src=full.src; };
}
function openViewer(i){ V.classList.add('open'); document.body.style.overflow='hidden'; show(i); }
function closeViewer(){ V.classList.remove('open'); document.body.style.overflow=''; }

document.getElementById('close').onclick=closeViewer;
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('zin').onclick=()=>zoomAt(scale*1.5,S.clientWidth/2,S.clientHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(scale/1.5,S.clientWidth/2,S.clientHeight/2);
document.getElementById('fit').onclick=fit;
document.getElementById('one').onclick=()=>zoomAt(1,S.clientWidth/2,S.clientHeight/2);
addEventListener('resize',()=>{ if(V.classList.contains('open')) fit(); });
addEventListener('keydown',e=>{
  if(!V.classList.contains('open')) return;
  if(e.key==='Escape') closeViewer();
  if(e.key==='ArrowLeft') show(idx-1);
  if(e.key==='ArrowRight') show(idx+1);
  if(e.key==='+'||e.key==='=') document.getElementById('zin').click();
  if(e.key==='-') document.getElementById('zout').click();
});
S.addEventListener('wheel',e=>{ e.preventDefault(); const r=S.getBoundingClientRect();
  zoomAt(scale*Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); },{passive:false});
S.addEventListener('dblclick',e=>{ const r=S.getBoundingClientRect();
  if(scale>fitScale*1.05) fit(); else zoomAt(fitScale*3, e.clientX-r.left, e.clientY-r.top); });

// Pointer events: drag to pan, two fingers to pinch-zoom
const pts=new Map(); let last=null, pinch=null;
S.addEventListener('pointerdown',e=>{ S.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); S.classList.add('drag'); last={x:e.clientX,y:e.clientY}; pinch=null; });
S.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=S.getBoundingClientRect();
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
    if(pinch){ zoomAt(scale*d/pinch.d, cx, cy); tx+=cx-pinch.cx; ty+=cy-pinch.cy; clamp(); apply(); }
    pinch={d,cx,cy}; return; }
  if(last){ tx+=e.clientX-last.x; ty+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; clamp(); apply(); }
});
const up=e=>{ pts.delete(e.pointerId); pinch=null; if(!pts.size){ S.classList.remove('drag'); last=null; } else { const p=[...pts.values()][0]; last={...p}; } };
S.addEventListener('pointerup',up); S.addEventListener('pointercancel',up);
</script>
</body>
</html>

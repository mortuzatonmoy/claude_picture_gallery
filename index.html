<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Picture Gallery</title>
<style>
body{margin:0;background:#0b0b10;color:#eee;font-family:system-ui,sans-serif}
header{text-align:center;padding:48px 16px 24px}h1{margin:0;font-weight:600;letter-spacing:.02em}
header p{color:#999;margin:8px 0 0}
main{display:grid;gap:24px;padding:24px;max-width:1400px;margin:auto;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
figure{margin:0;background:#15151d;border-radius:12px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
figcaption{padding:12px 16px;font-size:14px;color:#bbb}figcaption b{color:#fff;display:block;margin-bottom:2px}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:96vw;max-height:94vh}footer{text-align:center;color:#666;padding:32px;font-size:13px}
</style></head><body>
<header><h1>Claude Picture Gallery</h1><p>5 procedurally generated 4K (3840×2160) images, made with pure math in Python + NumPy</p></header>
<main>
<figure><img src="images/01_mandelbrot_spiral.jpg" loading="lazy" alt="Mandelbrot spiral"><figcaption><b>Mandelbrot Spiral</b>Deep zoom into Seahorse Valley, 1200 iterations, smooth coloring</figcaption></figure>
<figure><img src="images/02_julia_bloom.jpg" loading="lazy" alt="Julia set"><figcaption><b>Julia Bloom</b>Julia set for c = −0.8 + 0.156i</figcaption></figure>
<figure><img src="images/03_cosmic_nebula.jpg" loading="lazy" alt="Nebula"><figcaption><b>Cosmic Nebula</b>Domain-warped fractal Brownian motion noise</figcaption></figure>
<figure><img src="images/04_sunset_ranges.jpg" loading="lazy" alt="Mountain sunset"><figcaption><b>Sunset Ranges</b>Layered fractal mountain ridges with atmospheric haze</figcaption></figure>
<figure><img src="images/05_quasicrystal_mandala.jpg" loading="lazy" alt="Quasicrystal"><figcaption><b>Quasicrystal Mandala</b>Interference of 9 plane waves — 18-fold symmetry</figcaption></figure>
</main>
<div id="lb" onclick="this.style.display='none'"><img></div>
<footer>Generated by Claude · source: <a style="color:#88f" href="generate.py">generate.py</a></footer>
<script>document.querySelectorAll('main img').forEach(i=>i.onclick=()=>{lb.firstChild.src=i.src;lb.style.display='flex'})</script>
</body></html>
